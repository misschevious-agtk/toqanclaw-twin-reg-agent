name: Daily Regulatory Sync

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 6am UTC weekdays
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regulatory scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m agent.scraper

      - name: Commit updated content
        run: |
          git config user.name  "ToqanClaw Agent"
          git config user.email "agent@toqanclaw.ai"
          git add content/index.json
          git diff --staged --quiet || git commit -m "chore: daily regulatory sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
